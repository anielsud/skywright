name: Smoke test

# Boots the game in headless Chrome (WebGL via SwiftShader), flies every preset and fails on console errors.
# Reduced check: the runner has no GPU, so software WebGL draws only about one flight frame every few seconds.
# Each flight is still built and stepped (catches load/startup errors and NaN physics), but frame rate isn't checked.
# Informational: not a required check. The full check is `python3 tools/test/smoke.py` on your machine.
# The flights are split over 6 parallel jobs (smoke.py --shard): each boots the game and flies a sixth of the presets.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # (a part takes about 3-4 min; the whole suite in one job took 10-11, #180)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    name: smoke (part ${{ matrix.shard }}/6)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install websockets
        run: python -m pip install websockets
      - name: Smoke test
        run: python tools/test/smoke.py --out smoke-shots --quality low --size 512x320 --min-realtime 0 --shard ${{ matrix.shard }}/6
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots-${{ matrix.shard }}
          path: smoke-shots
          if-no-files-found: ignore

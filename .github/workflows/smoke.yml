name: Smoke test

# Boots the game in headless Chrome (WebGL via SwiftShader), flies every preset and fails on console errors.
# Reduced check: the runner has no GPU, so software WebGL draws only about one flight frame every few seconds.
# Each flight is still built and stepped (catches load/startup errors and NaN physics), but frame rate isn't checked.
# Informational: not a required check. The full check is `python3 tools/test/smoke.py` on your machine.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # (the full suite passed 10 min as presets were added: runs were stopped mid-way and showed as cancelled, #180)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install websockets
        run: python -m pip install websockets
      - name: Smoke test
        run: python tools/test/smoke.py --out smoke-shots --quality low --size 800x500 --min-realtime 0
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: smoke-shots
          if-no-files-found: ignore

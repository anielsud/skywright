name: Smoke test

# Boots the game in headless Chrome (WebGL via SwiftShader), flies every preset and fails on console errors.
# Informational: not a required check. Run the same thing locally with `python3 tools/test/smoke.py`.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install websockets
        run: python -m pip install websockets
      - name: Smoke test
        run: python tools/test/smoke.py --out smoke-shots
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: smoke-shots
          if-no-files-found: ignore

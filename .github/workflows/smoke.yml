name: Tests

# Every PR runs the whole suite, as parallel jobs:
# - the browser jobs (tools/test/jobs.py, one matrix entry each): headless Chrome with WebGL via SwiftShader (no GPU),
#   booted once per job, each map built once and every vehicle swapped into it, game time stepped, frames drawn only
#   for what is about drawing: hangar (boot, audio, windows, wind tunnel), nyc, islands, canyon-lauterbrunnen. Every
#   step fails on console errors, failed requests and shader stalls. Screenshots are attached to the run.
# - the Node tier (its job below): every logic, physics and geometry suite (known failures listed in
#   tools/test/known.json don't fail it).
# Informational: not a required check. Locally: python3 tools/test/run.py (or jobs.py <job>).
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: node tier (part ${{ matrix.shard }}/3)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Node suites
        run: node tools/test/node/run.mjs --jobs 4 --shard ${{ matrix.shard }}/3 # (split by place and case times: tools/test/node/times.json)

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        job: [hangar, nyc, islands, canyon-lauterbrunnen]
    name: browser (${{ matrix.job }})
    env:
      SKY_CDP_TIMEOUT: '120' # (software WebGL on the runner: a screenshot can take long)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install websockets
        run: python -m pip install websockets
      - name: ${{ matrix.job }}
        run: python tools/test/jobs.py ${{ matrix.job }} --quality low --ci --out job-shots
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.job }}
          path: job-shots
          if-no-files-found: ignore

# Builds the Android app (native/) signed with the permanent release key and publishes it as
# https://github.com/anielsud/skywright/releases/download/android/Skywright.apk
# The app loads the live site, so game releases need no rebuild; this runs when the app shell changes,
# weekly (refreshes the bundled offline fallback), or by hand.
name: Android app
on:
  push:
    branches: [main]
    paths: ['native/**', 'tools/native/**', '.github/workflows/android.yml']
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: android, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Release key
        env: { KS: '${{ secrets.ANDROID_KEYSTORE_B64 }}' }
        run: echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build
        env:
          SKYWRIGHT_KEYSTORE: ${{ runner.temp }}/release.jks
          SKYWRIGHT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SKYWRIGHT_KEY_ALIAS: skywright
          SKYWRIGHT_VERSION_CODE: ${{ github.run_number }}
        run: |
          export SKYWRIGHT_VERSION_NAME="$(sed -nE "s/^export const VERSION = '(.*)';/\1/p" src/version.js)"
          bash tools/native/build_android.sh --lite --release
          cp native/android/app/build/outputs/apk/release/app-release.apk Skywright.apk
          ls -lh Skywright.apk
      - name: Publish
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release view android >/dev/null 2>&1 || gh release create android --title "Skywright Android app" \
            --notes "Install on an Android tablet: download Skywright.apk, open it and allow installing. The app loads the live game, so it updates by itself."
          gh release upload android Skywright.apk --clobber

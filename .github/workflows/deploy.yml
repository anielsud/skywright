name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp build info
        run: |
          SHA="${GITHUB_SHA::7}"
          BUILT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          sed -i "s/^export const COMMIT = .*/export const COMMIT = '${SHA}';/" src/version.js
          sed -i "s/^export const BUILT = .*/export const BUILT = '${BUILT}';/" src/version.js
          # the crew posture solver's version: solved postures (baked below, and kept by each device) stay valid until it changes
          SOLVER="$(cat src/crew.js src/body.js assets/people/* | sha1sum | cut -c1-10)"
          sed -i "s/^export const SOLVER = .*/export const SOLVER = '${SOLVER}';/" src/version.js
          # the cabin lighting bake's version: bakes each device keeps (src/cabinLight.js) stay valid until it changes
          LIGHT="$(cat src/cabinLight.js src/interior.js | sha1sum | cut -c1-10)"
          sed -i "s/^export const LIGHT = .*/export const LIGHT = '${LIGHT}';/" src/version.js
          # the cockpit views' version: which cabin linings cover the windows (baked below, and kept by each device) stays valid until it changes
          VIEWS="$(cat src/stations.js | sha1sum | cut -c1-10)"
          sed -i "s/^export const VIEWS = .*/export const VIEWS = '${VIEWS}';/" src/version.js
          echo "SOLVER=${SOLVER}" >> "$GITHUB_ENV"; echo "VIEWS=${VIEWS}" >> "$GITHUB_ENV" # (the bake's caches below)
          # a fresh offline-cache name per deploy, so installed apps always pick up the new build
          sed -i "s/^const CACHE = .*/const CACHE = 'skywright-${SHA}';/" sw.js
          cat src/version.js
          rm -rf native # the Capacitor app projects are not part of the site
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Start-up data (part pictures, stock crews' postures, stunt park sites, which cockpit linings cover the windows) worked out here instead of on every player's device.
      # Optional: without it the game works them out itself, as before.
      # The last deploy's solved postures and cockpit views for the same SOLVER / VIEWS (both are keyed by what they're
      # worked out from, so they stay right): the bake then only solves what changed, about two thirds of its time.
      # Each deploy saves its own (run_id) and the next restores the newest.
      - uses: actions/cache@v4
        with:
          path: assets/boot/postures.json
          key: boot-postures-${{ env.SOLVER }}-${{ github.run_id }}
          restore-keys: boot-postures-${{ env.SOLVER }}-
      - uses: actions/cache@v4
        with:
          path: assets/boot/views.json
          key: boot-views-${{ env.VIEWS }}-${{ github.run_id }}
          restore-keys: boot-views-${{ env.VIEWS }}-
      - name: Bake start-up data
        continue-on-error: true
        timeout-minutes: 10
        run: |
          python -m pip install websockets
          python tools/bake/boot.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4

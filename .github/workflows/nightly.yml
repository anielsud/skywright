name: Nightly browser suites

# Every browser-tier suite on main, once a night (PRs run only the ones covering what they change: smoke.yml).
# Software WebGL on the runner: run.py --ci (smaller windows, fewer repeats, no frame-time limits).
on:
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [restart, placecheck, padcheck, helipadcheck, startbakes-stunts, tunnelcheck-ui]
    name: ${{ matrix.suite }}
    env:
      SKY_CDP_TIMEOUT: '120'
      SKY_TRACE: '1' # (print every CDP call over a second: where the time goes)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install websockets
        run: python -m pip install websockets
      - name: ${{ matrix.suite }}
        run: python tools/test/run.py --ci ${{ matrix.suite }}
